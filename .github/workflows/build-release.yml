name: Build Rust Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-${{ matrix.arch }}
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows installer and updater package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少 GitHub Actions Secret：TAURI_SIGNING_PRIVATE_KEY。请按 docs/应用内更新发布说明.md 完成一次配置。'
          }
          npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Smoke test installed AIMux
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '未找到 Tauri NSIS 安装包' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'AIMux-smoke'
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "AIMux 安装失败，退出码：$($installerProcess.ExitCode)" }
          $application = Join-Path $installDirectory 'aimux.exe'
          if (-not (Test-Path $application)) { throw "未找到已安装的主程序：$application" }
          $process = Start-Process -FilePath $application -PassThru
          try {
            $health = $null
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7789/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { break }
              } catch {
                if ($process.HasExited) { throw 'AIMux 主程序启动后意外退出' }
              }
            }
            if ($health.status -ne 'ok') { throw 'AIMux 启动后健康检查超时' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '未找到 Tauri NSIS 安装包' }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "未找到 Tauri Windows 更新包签名：$signature" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName "release/AIMux-Windows-${{ matrix.arch }}.exe"
          Copy-Item $signature "release/AIMux-Windows-${{ matrix.arch }}.exe.sig"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-Windows-${{ matrix.arch }}
          path: release/AIMux-Windows-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload Windows updater package
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-updater-Windows-${{ matrix.arch }}
          path: |
            release/AIMux-Windows-${{ matrix.arch }}.exe.sig
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri macOS app and updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '缺少 GitHub Actions Secret：TAURI_SIGNING_PRIVATE_KEY。请按 docs/应用内更新发布说明.md 完成一次配置。' >&2
            exit 1
          fi
          npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package macOS app
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/AIMux.app \
            release/AIMux-macOS-${{ matrix.arch }}.zip
          updater=$(find src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -type f | head -n 1)
          if [ -z "$updater" ]; then
            echo '未找到 Tauri macOS 更新包' >&2
            exit 1
          fi
          if [ ! -f "$updater.sig" ]; then
            echo "未找到 Tauri macOS 更新包签名：$updater.sig" >&2
            exit 1
          fi
          cp "$updater" "release/AIMux-macOS-${{ matrix.arch }}.app.tar.gz"
          cp "$updater.sig" "release/AIMux-macOS-${{ matrix.arch }}.app.tar.gz.sig"

      - name: Upload macOS app
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-macOS-${{ matrix.arch }}
          path: release/AIMux-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload macOS updater package
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-updater-macOS-${{ matrix.arch }}
          path: |
            release/AIMux-macOS-${{ matrix.arch }}.app.tar.gz
            release/AIMux-macOS-${{ matrix.arch }}.app.tar.gz.sig
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: AIMux-*
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          base_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          windows_x64_sig=$(tr -d '\r\n' < release-assets/AIMux-Windows-x64.exe.sig)
          windows_arm64_sig=$(tr -d '\r\n' < release-assets/AIMux-Windows-arm64.exe.sig)
          macos_arm64_sig=$(tr -d '\r\n' < release-assets/AIMux-macOS-arm64.app.tar.gz.sig)
          cat > release-assets/latest.json <<EOF
          {
            "version": "${version}",
            "notes": "AIMux ${RELEASE_TAG}，请查看 GitHub Release 了解本次更新内容。",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": { "signature": "${windows_x64_sig}", "url": "${base_url}/AIMux-Windows-x64.exe" },
              "windows-aarch64": { "signature": "${windows_arm64_sig}", "url": "${base_url}/AIMux-Windows-arm64.exe" },
              "darwin-aarch64": { "signature": "${macos_arm64_sig}", "url": "${base_url}/AIMux-macOS-arm64.app.tar.gz" }
            }
          }
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "缺少发布说明文件：$notes_file" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "AIMux $RELEASE_TAG" \
              --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "AIMux $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
