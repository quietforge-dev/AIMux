[package]
name = "aimux"
version = "0.2.24"
description = "AIMux gateway and Tauri desktop application"
authors = ["quietforge-dev"]
edition = "2021"
default-run = "aimux"

[lib]
name = "aimux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
tauri = { version = "2", features = ["devtools", "tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.5.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
